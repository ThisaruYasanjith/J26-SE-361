[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-ai-service"
version = "0.1.0"
description = "Architecture context loading service for future AI analysis."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "sentence-transformers>=3.4,<6",
    "faiss-cpu>=1.9,<2",
    "numpy>=1.26,<3",
    "transformers>=4.56,<6",
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.45,<1",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
architecture-ai-service = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: opt-in real model and RAG validation; may download model weights"]
